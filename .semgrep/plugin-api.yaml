rules:
  - id: require-plugin-api
    languages: [generic]
    patterns:
      - pattern-regex: '(?s)\A.*' 
      - pattern-not-regex: '(?s).*property\s+var\s+pluginApi.*'
    message: "Missing required property pluginApi. For example: property var pluginApi: null"
    severity: ERROR
    paths:
      include: 
        - "**/BarWidget.qml"
        - "**/DesktopWidget.qml"
        - "**/DesktopWidgetSettings.qml"
        - "**/ControlCenterWidget.qml"
        - "**/LauncherProvider.qml"
        - "**/Main.qml"
        - "**/Panel.qml"
        - "**/Settings.qml"
